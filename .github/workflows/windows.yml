name: Windows preview checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run publication:audit
      - run: node scripts/package.mjs
      - run: npm run release:verify -- --require-license
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-preview
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error
          retention-days: 14
# Real host installation probes run locally in isolated profiles, without model calls.
# This workflow does not publish a GitHub Release or run authenticated model turns.
